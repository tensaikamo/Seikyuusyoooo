name = "seikyuusyo-reports"
main = "worker.js"
compatibility_date = "2025-01-01"

# ダッシュボードで作った KV の id をここに書く
[[kv_namespaces]]
binding = "REPORTS"
id = "ここに KV namespace の id"

[vars]
ALLOW_ORIGIN = "https://tensaikamo.github.io"

# ADMIN_KEY と INGEST_KEY は平文で置かず secret で入れる
#   wrangler secret put ADMIN_KEY
#   wrangler secret put INGEST_KEY
