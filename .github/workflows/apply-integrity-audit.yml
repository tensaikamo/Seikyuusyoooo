name: Apply remaining invoice integrity gate

on:
  push:
    branches:
      - agent/invoice-hardening-phase0
    paths:
      - .github/workflows/apply-integrity-audit.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/invoice-hardening-phase0
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact-source integrity patch
        run: python3 scripts/integrity_audit.py
      - name: Check app syntax
        run: node --check app.js
      - name: Run full test suite
        run: node --test tests/*.test.js
      - name: Remove one-shot machinery
        run: rm -f scripts/integrity_audit.py .github/workflows/apply-integrity-audit.yml
      - name: Commit verified result
        run: |
          git config user.name "invoice-hardening-bot"
          git config user.email "invoice-hardening-bot@users.noreply.github.com"
          git add app.js tests/core-invariants.test.js scripts/integrity_audit.py .github/workflows/apply-integrity-audit.yml
          git commit -m "fix: cross-check invoice parties and billing period"
          git push origin HEAD:agent/invoice-hardening-phase0
