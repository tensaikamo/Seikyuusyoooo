name: Apply invoice integrity audit

on:
  push:
    branches:
      - agent/invoice-hardening-phase0
    paths:
      - scripts/integrity_audit.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/invoice-hardening-phase0
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact-source integrity patch
        run: python3 scripts/integrity_audit.py
      - name: Check full app syntax
        run: node --check app.js
      - name: Run full tests
        run: node --test tests/*.test.js
      - name: Commit verified changes
        run: |
          git config user.name "invoice-hardening-bot"
          git config user.email "invoice-hardening-bot@users.noreply.github.com"
          git add app.js tests/core-invariants.test.js
          git commit -m "fix: enforce issued invoice snapshot integrity"
          git push origin HEAD:agent/invoice-hardening-phase0
