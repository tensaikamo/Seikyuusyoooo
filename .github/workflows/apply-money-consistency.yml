name: Apply money consistency hardening

on:
  push:
    branches:
      - agent/invoice-a4-seal-save-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply guarded patch
        run: python3 scripts/apply_money_consistency_patch.py

      - name: Syntax check
        run: node --check app.js && node --check server/worker.js

      - name: Full test suite
        run: node --test tests/*.test.js

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Align A4 detail, transport defaults, and report calculations"
          git push origin HEAD:${{ github.ref_name }}
