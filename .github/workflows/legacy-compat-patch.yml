name: Apply legacy invoice compatibility patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/invoice-hardening-final-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/invoice-hardening-final-audit
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded patch
        run: python3 tools/apply_legacy_compat_patch.py
      - name: Check syntax
        run: node --check app.js
      - name: Run all tests
        run: node --test tests/*.test.js
      - name: Remove one-shot patch machinery
        run: rm -f tools/apply_legacy_compat_patch.py .github/workflows/legacy-compat-patch.yml
      - name: Commit verified result
        run: |
          git config user.name "invoice-hardening-bot"
          git config user.email "invoice-hardening-bot@users.noreply.github.com"
          git add app.js tests/core-invariants.test.js tools/apply_legacy_compat_patch.py .github/workflows/legacy-compat-patch.yml
          git commit -m "fix: preserve legacy issued invoice snapshots"
          git push origin HEAD:agent/invoice-hardening-final-audit
