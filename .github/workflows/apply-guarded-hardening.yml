name: Apply guarded hardening patch

on:
  push:
    branches:
      - agent/invoice-hardening-phase0
    paths:
      - scripts/guarded/*.py

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'guarded-hardening-applied') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/invoice-hardening-phase0
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve exactly one changed patch script
        id: patch
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only HEAD^ HEAD -- 'scripts/guarded/*.py')
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one guarded patch script, found ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          echo "file=${files[0]}" >> "$GITHUB_OUTPUT"
      - name: Apply exact-source patch
        run: python3 "${{ steps.patch.outputs.file }}"
      - name: Run regression tests before commit
        run: node --test tests/*.test.js
      - name: Commit only verified runtime/test changes
        shell: bash
        run: |
          git config user.name "invoice-hardening-bot"
          git config user.email "invoice-hardening-bot@users.noreply.github.com"
          git add app.js tests/core-invariants.test.js sw.js README.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No runtime/test changes to commit"
            exit 0
          fi
          git commit -m "fix: guarded-hardening-applied $(basename '${{ steps.patch.outputs.file }}' .py)"
          git push origin HEAD:agent/invoice-hardening-phase0
