name: One-shot legacy settings compatibility gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-apply:
    if: github.event.pull_request.head.ref == 'agent/invoice-hardening-final-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout final audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/invoice-hardening-final-audit
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply staged patch
        run: python3 tools/apply_legacy_settings_compat_patch.py
      - name: Check full app syntax
        run: node --check app.js
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: Run full regression suite
        run: node --test tests/*.test.js
      - name: Commit only after all gates pass
        run: |
          git config user.name "invoice-hardening-bot"
          git config user.email "invoice-hardening-bot@users.noreply.github.com"
          rm -f tools/apply_legacy_settings_compat_patch.py
          rm -f .github/workflows/one-shot-legacy-settings-fix.yml
          git add app.js tests/core-invariants.test.js tools/apply_legacy_settings_compat_patch.py .github/workflows/one-shot-legacy-settings-fix.yml
          git commit -m "fix: preserve legacy top-level settings"
          git push origin HEAD:agent/invoice-hardening-final-audit
