name: Core regression tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout final audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/invoice-hardening-final-audit
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply staged legacy live-data patch
        run: python3 tools/apply_legacy_live_data_patch.py
      - name: Check full app syntax
        run: node --check app.js
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: Run regression and invariant tests
        run: node --test tests/*.test.js
      - name: Commit verified patch
        run: |
          git config user.name "invoice-hardening-bot"
          git config user.email "invoice-hardening-bot@users.noreply.github.com"
          rm -f tools/apply_legacy_live_data_patch.py
          git add -A
          git commit -m "fix: preserve pre-cap values in legacy backups"
          git push origin HEAD:agent/invoice-hardening-final-audit
