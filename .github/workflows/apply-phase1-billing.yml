name: Apply guarded Phase 1 billing fix

on:
  push:
    branches:
      - agent/invoice-hardening-phase0
    paths:
      - scripts/apply_phase1_billing.py

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'phase1-billing-applied') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/invoice-hardening-phase0
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact-source patch
        run: python3 scripts/apply_phase1_billing.py
      - name: Run regression tests before commit
        run: node --test tests/*.test.js
      - name: Commit only verified changes
        run: |
          git config user.name "invoice-hardening-bot"
          git config user.email "invoice-hardening-bot@users.noreply.github.com"
          git add app.js tests/core-invariants.test.js
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "fix: phase1-billing-applied"
          git push origin HEAD:agent/invoice-hardening-phase0
